<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_geral.css">
    <title>CRB | Três letras, Duas Cores, Uma Paixão</title>
    <link rel="shortcut icon" href="CRB_logo.svg.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div id="bv">
            <p>Bem-vindo</p>
            <p id="user"><u>ADMINISTRADOR</u><i class="fa-solid fa-chess-king"></i></p>
           
        </div>
        <div id="socio">
            <div id = "redes">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-whatsapp"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-youtube"></i>
            </div>
        </div>
    </header>
    <section class="borda_white">
        <div class="borda">
            <ul id="lista">
                <li id="inicio">INICIO</li>
                <li id="historia">HISTÓRIA <i class="fa-solid fa-angle-down"></i></li>
                <li id="galofiel">GALO FIEL <i class="fa-solid fa-angle-down"></i></li>
            </ul>
            <img id="crb" src="CRB_logo.svg.png" alt="">
            <ul id="lista-dois">
                <li id="imprensa">IMPRENSA <i class="fa-solid fa-angle-down"></i></li>
                <li id="transparencia"> TRANSPARÊNCIA <i class="fa-solid fa-angle-down"></i></li>
            </ul>
        </div>
    </section>
    <section class="geral">
        <div id="geral">
            <div id="pj">
                <h1>Próximo jogo</h1>
            </div>
            <div id="cb">
                <img id="cb" src="copa-do-brasil-logo.png" alt="">
            </div>
            <div id="jogo">
                <img id="visitante_geral" src="Santos_Logo.png" alt="">
                <p id="text">Copa do Brasil</p>
                <img id="crb_geral" src="CRB_logo.svg.png" alt="">
            </div>
            <div id="horario">
                <p>01/05 | Vila Belmiro - SP</p>
            </div>
            <div class="fim"><p id="Maior">#MaiorDeAlagoas</p></div>
            <iframe class="sppb-youtube-iframe" src="https://www.youtube.com/embed/dkIgFTqvrvU?playlist=dkIgFTqvrvU&autoplay=1&controls=0&loop=1&mute=1&rel=0&iv_load_policy=3&enablejsapi=1&showinfo=0&disablekb=1&modestbranding=1">
            </iframe>
            <div class="botoes-ingresso">
                <div class="check"><p><i id="check-ico" class="fa-solid fa-check"></i>Fazer Checkin</p></div>
                <div class="ingresso"><p> <i class="fa-solid fa-ticket"></i>Comprar Ingresso</p></div>

            </div>
        </div>
    </section>
    <script>
        document.getElementById("logout").addEventListener('click', function(){
            window.location.href = "login.html"
        })
    </script>
</body>
</html>
